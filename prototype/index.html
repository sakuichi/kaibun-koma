<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回文ケンカゴマ 試作</title>
<style>
/* 試作：動きと見た目の確認用。本体とは別物で、流用しない */
:root{
  --bg:#f6efe3; --surface:#fffdf8; --ink:#2a2118; --ink-soft:#6b5d4c; --line:#d9ccb6;
  /* 土俵（スタジアム）は夜の会場に見せるため、ライトでも暗い色にする */
  --stage-bg1:#26324f; --stage-bg2:#0a0e18; --stage-ink:#eef2ff;
  --bowl-1:#34466e; --bowl-2:#18223a; --bowl-3:#0b101e;
  --metal-1:#f4f7fb; --metal-2:#a3aec0; --metal-3:#404a5c; --neon:#2fe0ff; --neon2:#ff3dbe;
  --p1:#ff3b4e; --p1-dark:#6e0b1a; --p1-glow:#ff8a96; --p2:#2f8cff; --p2-dark:#0a2563; --p2-glow:#86c8ff;
  --gold1:#fff3a8; --gold2:#ffb21f;
  --shu:#d63a2c; --shu-dark:#8f2219; --kake:#2b4a9b; --kake-dark:#1a2d62;
  --tile:#fffdf6; --spark:#ffb81f; --mark:#ffe27a; --bar-bg:#eadfca;
  --body:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130f; --surface:#231d17; --ink:#f3ece0; --ink-soft:#b9ab95; --line:#40362b;
    --stage-bg1:#1b2440; --stage-bg2:#04060c;
    --shu:#e2493a; --shu-dark:#9b2a20; --kake:#5577dd; --kake-dark:#24387a;
    --tile:#f4efe2; --spark:#ffd95a; --mark:#7c6500; --bar-bg:#3a3128;
  }
}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#231d17; --ink:#f3ece0; --ink-soft:#b9ab95; --line:#40362b;
  --stage-bg1:#1b2440; --stage-bg2:#04060c;
  --shu:#e2493a; --shu-dark:#9b2a20; --kake:#5577dd; --kake-dark:#24387a;
  --tile:#f4efe2; --spark:#ffd95a; --mark:#7c6500; --bar-bg:#3a3128;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
.wrap{max-width:36rem;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.6rem;margin:.2rem 0 .2rem;letter-spacing:.02em}
.lead{margin:0 0 .8rem;color:var(--ink-soft);font-size:.9rem}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
#stage{display:block;width:100%;aspect-ratio:4/3;border:2px solid var(--ink);border-radius:1rem;background:radial-gradient(ellipse at 50% 25%,var(--stage-bg1),var(--stage-bg2));touch-action:manipulation}
.status{min-height:1.6em;margin:.5rem 0 0;font-weight:700;text-align:center}
.gauge{margin:.6rem 0 0;padding:.7rem;border:2px solid var(--ink);border-radius:.9rem;background:var(--surface)}
.gauge[hidden]{display:none}
/* 真ん中が最強。ど真ん中（46.5〜53.5%）が会心 */
.gbar{position:relative;height:1.8rem;border:2px solid var(--ink);border-radius:.5rem;overflow:hidden;
  background:linear-gradient(90deg,var(--bar-bg) 0 18%,var(--mark) 36%,var(--mark) 46.5%,var(--shu) 46.5% 53.5%,var(--mark) 53.5%,var(--mark) 64%,var(--bar-bg) 82% 100%)}
#needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink)}
.glabel{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-soft);margin:.2rem 0 .5rem}
.big{display:block;width:100%;min-height:3rem;border:2px solid var(--ink);border-radius:.9rem;background:var(--mark);font-weight:700;box-shadow:0 .2rem 0 var(--ink);cursor:pointer}
.big:active{transform:translateY(.15rem);box-shadow:0 .05rem 0 var(--ink)}
.big:disabled{opacity:.45;cursor:not-allowed}
.panels{display:grid;gap:.7rem;margin-top:.9rem}
@media (min-width:34rem){.panels{grid-template-columns:1fr 1fr}}
.panel{padding:.7rem;border:2px solid var(--ink);border-radius:.9rem;background:var(--surface);min-width:0}
.panel h2{margin:0 0 .4rem;font-size:1rem;display:flex;align-items:center;gap:.4rem}
.dot{width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--ink)}
.me .dot{background:var(--p1)} .opp .dot{background:var(--p2)}
.panel input,.panel select{width:100%;padding:.45rem .55rem;border:2px solid var(--line);border-radius:.6rem;background:var(--bg)}
.panel select{margin-top:.35rem;font-size:.85rem}
.yomi{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.4rem;margin-top:.35rem;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.panel .yomi input{padding:.3rem .5rem;font-size:.9rem;font-weight:500;color:var(--ink)}
.kind{display:inline-block;margin:.45rem 0 .2rem;padding:0 .6rem;border:2px solid var(--ink);border-radius:999px;font-weight:700;font-size:.85rem;background:var(--bg)}
.kind.ok{background:var(--mark)}
.note{margin:0;font-size:.8rem;color:var(--ink-soft);overflow-wrap:anywhere}
.note mark{background:var(--shu);color:#fff;border-radius:.2rem;padding:0 .1rem}
.st{display:grid;grid-template-columns:3.6rem 1fr 2.4rem;align-items:center;gap:.35rem;font-size:.8rem;margin-top:.25rem}
.st .b{height:.55rem;border-radius:999px;background:var(--bar-bg);overflow:hidden}
.st .b i{display:block;height:100%;background:var(--ink)}
.me .st .b i{background:var(--p1)} .opp .st .b i{background:var(--p2)}
.st span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:.6rem;margin-top:.9rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:.85rem}
.sub{flex:1;min-height:2.6rem;border:2px solid var(--ink);border-radius:.8rem;background:var(--surface);font-weight:700;cursor:pointer}
.sub:disabled{opacity:.45;cursor:not-allowed}
.dbg{margin-top:.8rem;font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>回文ケンカゴマ <small style="font-size:.9rem">試作5</small></h1>
  <p class="lead">確かめたいこと：(1) 回文の文字が上面に並んだコマが回る見た目　(2) ゲージで投げて、2つのコマが激しくぶつかり合う手応え</p>

  <canvas id="stage" aria-label="土俵"></canvas>
  <p class="status" id="status" aria-live="polite"></p>

  <div class="gauge" id="gauge" hidden>
    <div class="gbar"><div id="needle"></div></div>
    <div class="glabel"><span>弱</span><span>真ん中の赤で止めると会心</span><span>弱</span></div>
    <button class="big" id="throw">投げる！（スペースキー・土俵タップでも）</button>
  </div>

  <div class="panels">
    <section class="panel me">
      <h2><span class="dot"></span>あなたの回文</h2>
      <input id="inMe" value="竹藪焼けた" autocomplete="off" aria-label="あなたの回文">
      <select id="preMe" aria-label="あなたの回文のプリセット"></select>
      <label class="yomi">読み<input id="yoMe" inputmode="kana" autocomplete="off"></label>
      <div id="infoMe"></div>
    </section>
    <section class="panel opp">
      <h2><span class="dot"></span>あいての回文</h2>
      <input id="inOpp" value="私負けましたわ" autocomplete="off" aria-label="あいての回文">
      <select id="preOpp" aria-label="あいての回文のプリセット"></select>
      <label class="yomi">読み<input id="yoOpp" inputmode="kana" autocomplete="off"></label>
      <div id="infoOpp"></div>
    </section>
  </div>

  <div class="actions">
    <button class="big" id="fight">勝負！</button>
    <div class="row">
      <button class="sub" id="solo">ひとりで回す</button>
      <button class="sub" id="again" disabled>同じ条件でもう一回</button>
    </div>
    <label class="row"><input type="checkbox" id="slow"> スロー再生（3分の1の速さ）</label>
  </div>
  <p class="dbg" id="dbg"></p>
</div>

<script>
// ==== SIM START ====
// 判定・性能・対戦計算（試作版）。画面に依存しない
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}

const SMALL={'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ','ゕ':'か','ゖ':'け'};
// カタカナはひらがなにそろえ、かなと長音以外は捨てる
function toKana(text){
  const out=[];
  for(const ch of text.normalize('NFC')){
    let c=ch.codePointAt(0);
    if(c>=0x30A1&&c<=0x30F6)c-=0x60;
    const h=String.fromCodePoint(c);
    if((c>=0x3041&&c<=0x3096)||h==='ー')out.push(h);
  }
  return out;
}
function loosen(ch){
  if(ch==='ー')return '';
  const base=ch.normalize('NFD').replace(/[゙゚]/g,'');
  return SMALL[base]||base;
}
function judge(text){
  const kana=toKana(text);
  const n=kana.filter(c=>c!=='ー').length;
  if(n<3)return {kind:'短すぎ',kana,loose:[],n,uniq:0,bad:-1};
  const strict=kana.join('')===[...kana].reverse().join('');
  const loose=kana.map(loosen).filter(Boolean);
  const looseOk=loose.join('')===[...loose].reverse().join('');
  let bad=-1;
  if(!looseOk)for(let i=0;i<loose.length/2;i++)if(loose[i]!==loose[loose.length-1-i]){bad=i;break;}
  const uniq=new Set(loose).size;
  const lazy=looseOk&&(uniq<=2||uniq/loose.length<0.3);
  const kind=!looseOk?'不成立':lazy?'手抜き':strict?'成立':'ゆるめ';
  return {kind,kana,loose,n,uniq,bad};
}
// コマの大きさは全員同じ（長い回文は文字が上面からはみ出す）。長いほど重い、厳密なほど長く回る、多様なほど攻撃が強い
const RADIUS=0.13;
function stats(j){
  // 長さの効きは頭打ちにする（31文字の回文が5文字の約2倍の重さ）
  const weight=clamp(0.8+0.5*Math.log2(Math.max(j.n,3)/3),0.8,3);
  const endurance={'成立':1,'ゆるめ':0.75,'手抜き':0.6,'不成立':0.35,'短すぎ':0.3}[j.kind];
  // 長い回文は音の種類も自然に増えるので、攻撃の伸びも頭打ちにする
  let attack=0.3+0.9*(1-Math.exp(-j.uniq/6));
  if(j.kind==='手抜き')attack*=0.6;
  return {weight,endurance,attack,radius:RADIUS};
}
// 相手の投げの強さは回文から決まる固定値
function oppPower(text){return 0.45+0.4*((hashStr('p:'+text)%1000)/1000);}
// ゲージの位置0〜1 → 投げの強さ。真ん中ほど強く、端へ行くほど急に弱くなる。ど真ん中は会心で1を超える
const CRIT=0.035,CRIT_POWER=1.15;
function gaugePower(x){
  const d=Math.abs(x-0.5);
  if(d<=CRIT)return CRIT_POWER;
  return 0.1+0.9*Math.pow(clamp(1-(d-CRIT)/0.34,0,1),1.6);
}

const DT=1/60,TMAX=30,POST=2.4,SOLO_MAX=90;
// 調整値。Nodeで多数回まわして合わせた。成立どうしで、開始2秒以内の決着が約15%、場外が約30%、1試合の中央値が約6秒
const PULL0=0.5,K=0.9,SWIRL=0.2,FRICTION=0.6,DECAY=0.05,REST=0.4,CLASH=1.5,SPINLOSS=0.12,JITTER=1.0,LUCK=0.7,W0=0.4,LAUNCH=1.2,SPEEDW=0.3,WOBK=4,V_OUT=1.6,REST_RIM=0.55,CRIT_HIT=2.5,CRIT_DRAIN=0.18;
const W_WOBBLE=0.28,W_FALL=0.04;
// specs: [{stats,power}]（1つならひとり回し）。frames[i][k] = [x,y,回転,角度,傾き,傾きの向き,状態(0回転中/1場外/2停止),高さ]
function simulate(specs,seed){
  const rnd=mulberry32(seed||1);
  const solo=specs.length===1;
  const T=specs.map((sp,i)=>{
    const s=sp.stats,p=clamp(sp.power,0,CRIT_POWER),pv=Math.min(p,1);
    let x,y,vx,vy;
    if(solo){x=-0.5;y=0.2;vx=0.7*(0.6+0.4*pv);vy=-0.45*(0.6+0.4*pv);}
    else{
      // 中心めがけて勢いよく投げ入れ、最初に正面から激しくぶつける
      const side=i===0?-1:1,v=LAUNCH*(0.6+0.4*pv);
      x=side*0.7;y=side*0.08;
      const dir=Math.atan2(-y,-x)+side*0.1+(rnd()-0.5)*0.2;
      vx=Math.cos(dir)*v;vy=Math.sin(dir)*v;
    }
    return {x,y,vx,vy,z:0,vz:0,w:W0+(1-W0)*p,crit:p>=CRIT_POWER,ang:rnd()*6.283,phi:0.25,psi:rnd()*6.283,state:0,shake:0.25,
      m:s.weight,e:s.endurance,a:s.attack,r:s.radius};
  });
  const frames=[],hits=[],rims=[];
  let winner=null,kimarite=null,tDecide=null;
  for(let step=0;;step++){
    const t=step*DT;
    T.forEach((o,k)=>{
      if(o.state===1){
        o.x+=o.vx*DT;o.y+=o.vy*DT;o.vz-=6*DT;o.z+=o.vz*DT;
      }else if(o.state===2){
        o.vx*=0.85;o.vy*=0.85;o.x+=o.vx*DT;o.y+=o.vy*DT;o.phi=Math.min(1.35,o.phi+DT*3.5);
      }else{
        const d=Math.hypot(o.x,o.y)||1e-6;
        const wob=o.w<W_WOBBLE?(W_WOBBLE-o.w)/W_WOBBLE:0;
        const jit=JITTER+2.2*wob;
        // 引力が距離に比例だけだと、どの半径でも1周の時間が同じになり2つのコマが出会わない。一定の引力を足す
        const pull=PULL0+K*d;
        const ax=-o.x/d*pull-o.y/d*SWIRL*o.w+(rnd()-0.5)*jit;
        const ay=-o.y/d*pull+o.x/d*SWIRL*o.w+(rnd()-0.5)*jit;
        o.vx+=ax*DT;o.vy+=ay*DT;
        const fr=Math.exp(-FRICTION*DT);o.vx*=fr;o.vy*=fr;
        o.x+=o.vx*DT;o.y+=o.vy*DT;
        // 重いほど・厳密なほど回転が長持ちする。ひとり回しは長さと出来の差がはっきり出るようにする
        const lasting=solo?Math.pow(o.m,1.5):0.4+0.6*o.m;
        o.w-=DT*(DECAY/(o.e*lasting))*(1+wob*1.5);
        o.shake*=Math.exp(-3*DT);
        o.phi=0.03+o.shake+0.6*Math.pow(wob,1.3);
        o.psi+=DT*Math.min(14,0.8/Math.max(o.w,0.05));
        // 土俵の縁：外向きの勢いが強ければ場外、弱ければ跳ね返る。首を振っていると踏ん張れない
        const d2=Math.hypot(o.x,o.y),edge=1-o.r*0.6;
        if(d2>edge){
          const nx=o.x/d2,ny=o.y/d2,vr=o.vx*nx+o.vy*ny;
          if(vr>V_OUT*(1-0.5*wob)){o.state=1;o.vz=1.2;o.vx*=1.2;o.vy*=1.2;}
          else if(vr>0){
            o.vx-=(1+REST_RIM)*vr*nx;o.vy-=(1+REST_RIM)*vr*ny;
            o.x-=nx*(d2-edge);o.y-=ny*(d2-edge);o.shake+=0.15*vr;
            if(vr>0.25)rims.push({f:frames.length,x:nx,y:ny,p:clamp(vr/V_OUT,0,1),k});
          }
        }
        if(o.state===0&&o.w<=W_FALL){o.state=2;o.w=0;}
      }
      o.ang+=o.w*14*DT;
    });
    if(!solo){
      const A=T[0],B=T[1];
      const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),rr=A.r+B.r;
      if(A.state===0&&B.state===0&&d<rr&&d>1e-6){
        const nx=dx/d,ny=dy/d,im=1/A.m,jm=1/B.m,ov=rr-d;
        A.x-=nx*ov*im/(im+jm);A.y-=ny*ov*im/(im+jm);B.x+=nx*ov*jm/(im+jm);B.y+=ny*ov*jm/(im+jm);
        const rel=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
        if(rel<0){
          const J=-(1+REST)*rel/(im+jm);
          A.vx-=J*im*nx;A.vy-=J*im*ny;B.vx+=J*jm*nx;B.vy+=J*jm*ny;
          // 回転どうしの弾き合い：相手の攻撃×回転が強いほど、自分が軽いほど飛ばされる。当たりの良し悪しは種つき乱数
          // 会心で投げたコマは、最初の激突だけ攻撃が大きくなる（会心の一撃）
          const first=hits.length===0;
          const la=(1-LUCK+2*LUCK*rnd())*(first&&A.crit?CRIT_HIT:1),lb=(1-LUCK+2*LUCK*rnd())*(first&&B.crit?CRIT_HIT:1);
          const pa=A.a*A.w*la,pb=B.a*B.w*lb,sp=Math.min(1.5,-rel),kick=CLASH*(1-SPEEDW+SPEEDW*Math.min(1,sp));
          // 首を振り始めたコマは踏ん張りがきかず、飛ばされやすい
          const ka=kick*(1+WOBK*Math.max(0,(W_WOBBLE*1.6-A.w)/(W_WOBBLE*1.6)));
          const kb=kick*(1+WOBK*Math.max(0,(W_WOBBLE*1.6-B.w)/(W_WOBBLE*1.6)));
          A.vx-=nx*ka*pb*im;A.vy-=ny*ka*pb*im;B.vx+=nx*kb*pa*jm;B.vy+=ny*kb*pa*jm;
          // 同じ向きに回るコマは接点で逆向きにこすれ、横へずれる
          const tx=-ny,ty=nx,g=0.25*(A.w+B.w);
          A.vx+=tx*g*im;A.vy+=ty*g*im;B.vx-=tx*g*jm;B.vy-=ty*g*jm;
          A.w-=SPINLOSS*pb*im*(0.6+0.4*Math.min(1,sp));B.w-=SPINLOSS*pa*jm*(0.6+0.4*Math.min(1,sp));
          if(first&&A.crit)B.w-=CRIT_DRAIN;
          if(first&&B.crit)A.w-=CRIT_DRAIN;
          A.shake+=0.1+0.25*pb*im;B.shake+=0.1+0.25*pa*jm;
          hits.push({f:frames.length,x:A.x+nx*A.r,y:A.y+ny*A.r,p:clamp(sp*(pa+pb)*0.8,0.15,1)});
        }
      }
    }
    frames.push(T.map(o=>[o.x,o.y,o.w,o.ang,o.phi,o.psi,o.state,o.z]));
    if(tDecide===null){
      if(solo){
        if(T[0].state!==0||t>=SOLO_MAX)tDecide=t;
      }else{
        const [A,B]=T;
        if(A.state||B.state){
          if(A.state&&B.state){winner=-1;kimarite='相打ち';}
          else{winner=A.state?1:0;kimarite=T[1-winner].state===1?'場外':'先に止まる';}
          tDecide=t;
        }else if(t>=TMAX){winner=A.w>=B.w?0:1;kimarite='時間切れ';tDecide=t;}
      }
    }
    if(tDecide!==null&&t>=tDecide+POST)break;
  }
  return {frames,hits,rims,winner,kimarite,decideFrame:Math.round(tDecide/DT)};
}
// ==== SIM END ====
</script>
<script>
const $=id=>document.getElementById(id);
const cv=$('stage'),g=cv.getContext('2d');
const TILT=0.7,BOWL=0.1,GAUGE_SPEED=1.6;
let W=0,H=0,DPR=1,S=1,CX=0,CY=0,FONT='sans-serif';
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  S=Math.min(W*0.45,H*0.62);CX=W/2;CY=H*0.6;arenaCv=null;
}
let C={};
const texCache=new Map();
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  for(const k of ['ink','ink-soft','shu','kake','tile','spark','mark','bar-bg','surface','stage-bg1','stage-bg2','stage-ink','bowl-1','bowl-2','bowl-3','metal-1','metal-2','metal-3','neon','neon2','p1','p1-dark','p1-glow','p2','p2-dark','p2-glow','gold1','gold2'])C[k]=cs.getPropertyValue('--'+k).trim();
  FONT=getComputedStyle(document.body).fontFamily;
  texCache.clear();arenaCv=null;
}
// 土俵はすり鉢：中心ほど低く見せる
function proj(x,y){const d2=Math.min(1.2,x*x+y*y);return {x:CX+x*S,y:CY+y*S*TILT-BOWL*S*d2};}
function ell(x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2);}

// ---- 土俵：夜のスタジアム。描くのが重いので絵にしておく（カメラの寄りに備えて1.5倍の解像度） ----
let arenaCv=null;
function arenaTex(){
  if(arenaCv)return arenaCv;
  const k=DPR*1.5;
  arenaCv=document.createElement('canvas');arenaCv.width=Math.round(W*k);arenaCv.height=Math.round(H*k);
  const c=arenaCv.getContext('2d');c.setTransform(k,0,0,k,0,0);
  drawArena(c);
  return arenaCv;
}
function drawArena(c){
  const top=CY-BOWL*S,body=S*0.18,E=(x,y,rx,ry)=>{c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);};
  // 外側の胴（金属）と光の帯
  let gr=c.createLinearGradient(CX-S*1.2,0,CX+S*1.2,0);
  [[0,'metal-3'],[0.3,'metal-2'],[0.5,'metal-3'],[0.75,'metal-2'],[1,'metal-3']].forEach(([o,n])=>gr.addColorStop(o,C[n]));
  c.fillStyle=gr;E(CX,top+body,S*1.18,S*1.18*TILT);c.fill();c.fillRect(CX-S*1.18,top,S*2.36,body);
  c.strokeStyle=C.neon;c.lineWidth=2;c.beginPath();c.ellipse(CX,top+body*0.55,S*1.18,S*1.18*TILT,0,0,Math.PI);c.stroke();
  // 縁の天板（金属）と刻み
  gr=c.createLinearGradient(0,top-S*TILT*1.2,0,top+S*TILT*1.2);
  gr.addColorStop(0,C['metal-1']);gr.addColorStop(0.5,C['metal-2']);gr.addColorStop(1,C['metal-3']);
  c.fillStyle=gr;E(CX,top,S*1.18,S*1.18*TILT);c.fill();
  c.strokeStyle=C['metal-3'];c.lineWidth=1.5;
  for(let i=0;i<36;i++){const a=i/36*Math.PI*2;c.beginPath();c.moveTo(CX+Math.cos(a)*S*1.07,top+Math.sin(a)*S*1.07*TILT);c.lineTo(CX+Math.cos(a)*S*1.16,top+Math.sin(a)*S*1.16*TILT);c.stroke();}
  // すり鉢
  c.fillStyle=C['bowl-3'];E(CX,top,S*1.03,S*1.03*TILT);c.fill();
  c.save();E(CX,top,S,S*TILT);c.clip();
  gr=c.createRadialGradient(CX,CY-S*0.05,0,CX,CY-BOWL*S*0.5,S*1.05);
  gr.addColorStop(0,C['bowl-1']);gr.addColorStop(0.6,C['bowl-2']);gr.addColorStop(1,C['bowl-3']);
  c.fillStyle=gr;c.fillRect(CX-S*1.1,top-S,S*2.2,S*2);
  // 放射線と同心円
  c.strokeStyle=C.neon;c.lineWidth=1;c.globalAlpha=0.12;
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,p=proj(Math.cos(a),Math.sin(a)),q=proj(Math.cos(a)*0.18,Math.sin(a)*0.18);c.beginPath();c.moveTo(q.x,q.y);c.lineTo(p.x,p.y);c.stroke();}
  c.globalAlpha=0.35;
  for(const [d,col,lw] of [[0.18,C.neon,2],[0.45,C.neon2,1.5],[0.72,C.neon,1]]){c.strokeStyle=col;c.lineWidth=lw;E(CX,CY-BOWL*S*d*d,S*d,S*d*TILT);c.stroke();}
  // 外周の文字の輪と、中央の紋
  c.globalAlpha=0.28;c.fillStyle=C['stage-ink'];c.textAlign='center';c.textBaseline='middle';
  const ring=[...'KAIBUN KENKA KOMA ◆ 回文ケンカゴマ ◆ '.repeat(2)],d=0.87;
  c.font=`900 ${S*0.065}px ${FONT}`;
  ring.forEach((ch,i)=>{const a=i/ring.length*Math.PI*2;c.save();c.translate(CX+Math.cos(a)*S*d,CY-BOWL*S*d*d+Math.sin(a)*S*d*TILT);c.scale(1,TILT);c.rotate(a+Math.PI/2);c.fillText(ch,0,0);c.restore();});
  c.globalAlpha=0.16;c.font=`900 ${S*0.24}px ${FONT}`;c.save();c.translate(CX,CY);c.scale(1,TILT);c.fillText('回',0,0);c.restore();
  // 縁ぎわを暗くして深さを出す
  c.globalAlpha=1;c.save();c.translate(CX,CY);c.scale(1,TILT);
  gr=c.createRadialGradient(0,0,S*0.55,0,0,S*1.1);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');
  c.fillStyle=gr;c.fillRect(-S*1.2,-S*1.6,S*2.4,S*3.2);c.restore();
  c.restore();
  // ネオンの縁（にじみを重ね描き）
  c.save();c.globalCompositeOperation='lighter';
  for(const [lw,a] of [[10,0.12],[5,0.25],[2,0.9]]){c.globalAlpha=a;c.strokeStyle=C.neon;c.lineWidth=lw;E(CX,top,S*1.02,S*1.02*TILT);c.stroke();}
  c.restore();
}

// ---- コマの上面：円盤の絵と、回文を横書きで並べた文字の絵を作っておき、回して斜めに貼る ----
// 文字の大きさは固定。長い回文は上面からはみ出す
const NO_HEAD='ぁぃぅぇぉっゃゅょゎゕゖァィゥェォッャュョヮヵヶー、。！？';
const FACE_FS=1.3,TEX_PX=120; // 文字の大きさ（上面の半径に対する割合）、絵の解像度（上面の半径あたりのピクセル）
// L行に分ける。円の形に合わせて真ん中の行ほど長くし、行頭に小さい字・長音が来たら前の行へ送る
function splitLines(chars,L){
  const n=chars.length,w=[];
  for(let i=0;i<L;i++){const t=L===1?0:(i-(L-1)/2)/(L/2);w.push(Math.sqrt(Math.max(0.2,1-t*t)));}
  const sum=w.reduce((a,b)=>a+b,0),lines=[];
  let pos=0,acc=0;
  for(let i=0;i<L;i++){
    acc+=w[i];
    let end=i===L-1?n:Math.round(acc/sum*n);
    end=Math.min(Math.max(end,pos+1),n-(L-1-i));
    lines.push(chars.slice(pos,end));pos=end;
  }
  for(let i=1;i<lines.length;i++)while(lines[i].length>1&&NO_HEAD.includes(lines[i][0]))lines[i-1].push(lines[i].shift());
  return lines.map(l=>l.join(''));
}
// 行数：1行の文字数を文字数の平方根くらいにして、文字のかたまりが丸っぽくなるようにする
const lineCount=n=>Math.ceil(n/Math.max(3,Math.ceil(Math.sqrt(n)*1.15)));
// 上面の絵：刃の突き出た金属のアタックリングと、文字を載せる自分の色のプレート。half は上面の半径を1とした絵の半分の大きさ
function ringTex(meta){
  const key='ring|'+meta.color+'|'+meta.blades;
  if(texCache.has(key))return texCache.get(key);
  const R=TEX_PX,T=Math.ceil(R*2.5),c=document.createElement('canvas');c.width=c.height=T;
  const x=c.getContext('2d');x.translate(T/2,T/2);
  const P=(r,a)=>[Math.cos(a)*r*R,Math.sin(a)*r*R];
  const metal=()=>{const gr=x.createLinearGradient(-R,-R,R,R);gr.addColorStop(0,C['metal-1']);gr.addColorStop(0.45,C['metal-2']);gr.addColorStop(0.55,C['metal-3']);gr.addColorStop(1,C['metal-2']);return gr;};
  // 刃（手裏剣のように反らせる）
  const n=meta.blades,sw=Math.PI*2/n;
  x.lineCap='round';x.lineJoin='round';
  for(let k=0;k<n;k++){
    const a=k*sw;
    x.beginPath();x.moveTo(...P(0.82,a-sw*0.3));
    x.quadraticCurveTo(...P(1.08,a-sw*0.12),...P(1.2,a+sw*0.12));
    x.quadraticCurveTo(...P(1.02,a+sw*0.16),...P(0.86,a+sw*0.32));
    x.closePath();x.fillStyle=metal();x.fill();x.lineWidth=R*0.025;x.strokeStyle=C['metal-3'];x.stroke();
    x.beginPath();x.moveTo(...P(0.9,a-sw*0.12));x.quadraticCurveTo(...P(1.04,a),...P(1.12,a+sw*0.1));
    x.lineWidth=R*0.05;x.strokeStyle=meta.color;x.stroke();
  }
  // 金属のリング（扇状のグラデーションでクロームに見せる）
  let gr=metal();
  if(x.createConicGradient){gr=x.createConicGradient(0,0,0);[[0,'metal-1'],[0.12,'metal-3'],[0.25,'metal-1'],[0.4,'metal-2'],[0.55,'metal-1'],[0.7,'metal-3'],[0.85,'metal-1'],[1,'metal-1']].forEach(([o,k])=>gr.addColorStop(o,C[k]));}
  x.beginPath();x.arc(0,0,R*0.98,0,Math.PI*2);x.fillStyle=gr;x.fill();x.lineWidth=R*0.03;x.strokeStyle=C['metal-3'];x.stroke();
  x.beginPath();x.arc(0,0,R*0.84,0,Math.PI*2);x.lineWidth=R*0.04;x.stroke();
  for(let k=0;k<n;k++){const [bx,by]=P(0.91,(k+0.5)*sw);x.beginPath();x.arc(bx,by,R*0.035,0,Math.PI*2);x.fillStyle=C['metal-1'];x.fill();x.lineWidth=R*0.012;x.stroke();}
  // プレート（自分の色・六角の模様・光る縁）
  gr=x.createRadialGradient(-R*0.2,-R*0.25,R*0.05,0,0,R*0.8);gr.addColorStop(0,meta.glow);gr.addColorStop(0.45,meta.color);gr.addColorStop(1,meta.dark);
  x.beginPath();x.arc(0,0,R*0.78,0,Math.PI*2);x.fillStyle=gr;x.fill();
  x.save();x.clip();x.globalAlpha=0.14;x.strokeStyle='#000';x.lineWidth=R*0.012;
  const hs=R*0.11;
  for(let row=-8;row<=8;row++)for(let col=-8;col<=8;col++){
    const cx=col*hs*1.5,cy=row*hs*1.732+(col%2?hs*0.866:0);
    x.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;x.lineTo(cx+Math.cos(a)*hs*0.95,cy+Math.sin(a)*hs*0.95);}x.closePath();x.stroke();
  }
  x.restore();
  x.beginPath();x.arc(0,0,R*0.78,0,Math.PI*2);x.lineWidth=R*0.035;x.strokeStyle=meta.glow;x.stroke();
  const t={c,half:T/2/R};
  texCache.set(key,t);
  return t;
}
// 文字の絵。hw, hh は上面の半径を1とした半分の幅・高さ
function textTex(meta){
  const key='text|'+meta.chars.join('')+'|'+meta.color;
  if(texCache.has(key))return texCache.get(key);
  const fs=FACE_FS*TEX_PX,lines=splitLines(meta.chars,lineCount(meta.chars.length));
  const m=document.createElement('canvas').getContext('2d');m.font=`900 ${fs}px ${FONT}`;
  const pad=fs*0.45,w=Math.ceil(Math.max(...lines.map(l=>m.measureText(l).width))+pad*2),h=Math.ceil(lines.length*fs*1.12+pad*2);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.font=`900 ${fs}px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  const ys=lines.map((ln,i)=>h/2+(i-(lines.length-1)/2)*fs*1.12);
  // 自分の色の光のにじみ → 黒い縁 → 白から自分の色へのグラデーション
  x.save();x.shadowColor=meta.glow;x.shadowBlur=fs*0.35;x.lineWidth=fs*0.22;x.strokeStyle=meta.color;
  lines.forEach((ln,i)=>x.strokeText(ln,w/2,ys[i]));x.restore();
  x.lineWidth=fs*0.15;x.strokeStyle='#05070d';lines.forEach((ln,i)=>x.strokeText(ln,w/2,ys[i]));
  lines.forEach((ln,i)=>{
    const gr=x.createLinearGradient(0,ys[i]-fs*0.5,0,ys[i]+fs*0.5);gr.addColorStop(0,'#ffffff');gr.addColorStop(0.55,'#ffffff');gr.addColorStop(1,meta.glow);
    x.fillStyle=gr;x.fillText(ln,w/2,ys[i]);
  });
  const t={c,hw:w/2/TEX_PX,hh:h/2/TEX_PX};
  texCache.set(key,t);
  return t;
}

function drawTop(meta,f,lift){
  const [x,y,w,ang,phi,psi,state,z]=f;
  const p=proj(x,y),rpx=meta.radius*S;
  let alpha=1,L=lift*S;
  if(state===1){L+=z*S;if(z<0)alpha=clamp(1+z*3,0,1);}
  if(alpha<=0)return;
  g.save();g.globalAlpha=alpha;
  if(state===0&&w>0.05){
    g.save();g.globalCompositeOperation='lighter';g.translate(p.x,p.y);g.scale(1,TILT);
    const fg=g.createRadialGradient(0,0,0,0,0,rpx*3.2);fg.addColorStop(0,meta.glow);fg.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=alpha*0.5*clamp(w,0,1);g.fillStyle=fg;g.beginPath();g.arc(0,0,rpx*3.2,0,Math.PI*2);g.fill();g.restore();
  }
  if(!(state===1&&z<0)){
    g.save();g.translate(p.x,p.y);g.scale(1,TILT);
    const sg=g.createRadialGradient(0,0,0,0,0,rpx*1.15);sg.addColorStop(0,'rgba(0,0,0,.6)');sg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sg;g.beginPath();g.arc(0,0,rpx*1.15,0,Math.PI*2);g.fill();g.restore();
  }
  g.translate(p.x,p.y-L);
  g.rotate(phi*Math.cos(psi));
  g.scale(1,1-0.35*Math.abs(Math.sin(psi))*Math.sin(phi));
  const Hh=rpx*0.6,th=rpx*0.16,Dy=-Hh,collar=Dy+th+rpx*0.08;
  // とがった金属の軸先と、色付きの首輪
  let gr=g.createLinearGradient(-rpx*0.3,0,rpx*0.3,0);gr.addColorStop(0,C['metal-3']);gr.addColorStop(0.45,C['metal-1']);gr.addColorStop(1,C['metal-3']);
  g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.lineTo(-rpx*0.3,collar);g.lineTo(rpx*0.3,collar);g.closePath();g.fill();
  ell(0,collar,rpx*0.42,rpx*0.42*TILT);g.fillStyle=meta.dark;g.fill();
  // 胴の側面（金属）
  gr=g.createLinearGradient(-rpx,0,rpx,0);gr.addColorStop(0,C['metal-3']);gr.addColorStop(0.35,C['metal-2']);gr.addColorStop(0.6,C['metal-3']);gr.addColorStop(1,C['metal-3']);
  g.fillStyle=gr;ell(0,Dy+th,rpx*0.98,rpx*0.98*TILT);g.fill();g.fillRect(-rpx*0.98,Dy,rpx*1.96,th);
  // 上面（回る）
  const ring=ringTex(meta),tt=textTex(meta),drawText=()=>g.drawImage(tt.c,-tt.hw*rpx,-tt.hh*rpx,tt.hw*rpx*2,tt.hh*rpx*2);
  g.save();g.translate(0,Dy);g.scale(1,TILT);
  g.save();g.rotate(ang);g.drawImage(ring.c,-ring.half*rpx,-ring.half*rpx,ring.half*rpx*2,ring.half*rpx*2);g.restore();
  // 照り返しは向きを固定する（回ると刃がきらめいて見える）
  g.save();g.globalCompositeOperation='lighter';
  const sp=g.createRadialGradient(-rpx*0.35,-rpx*0.45,0,-rpx*0.35,-rpx*0.45,rpx*0.9);sp.addColorStop(0,'rgba(255,255,255,.35)');sp.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=sp;g.beginPath();g.arc(0,0,rpx,0,Math.PI*2);g.fill();
  // 回転中の光の輪と、光の筋
  if(w>0.25){
    const k=clamp((w-0.25)/0.75,0,1),aura=Math.max(1.22,Math.hypot(tt.hw,tt.hh)*0.8)*rpx;
    for(const [lw,a] of [[0.16,0.12],[0.08,0.25],[0.03,0.8]]){g.globalAlpha=alpha*a*k;g.strokeStyle=meta.glow;g.lineWidth=rpx*lw;g.beginPath();g.arc(0,0,aura,0,Math.PI*2);g.stroke();}
    g.rotate(ang*1.7);g.globalAlpha=alpha*k*0.9;g.strokeStyle='#ffffff';g.lineWidth=Math.max(1.5,rpx*0.03);g.lineCap='round';
    for(let i=0;i<3;i++){g.beginPath();g.arc(0,0,aura*1.07,i*2.094,i*2.094+0.7);g.stroke();}
  }
  g.restore();
  // 文字：速く回っている間は残像を重ねる
  if(w>0.3){
    for(let k=3;k>=1;k--){g.save();g.globalAlpha=alpha*0.22;g.rotate(ang-k*0.2*w);drawText();g.restore();}
  }
  g.rotate(ang);g.globalAlpha=alpha;drawText();
  g.restore();
  g.restore();
}

// ---- 入力と判定表示 ----
// 試作用の小さな読み表（本実装は辞書を使う）。「金」はわざと「きん」と読み違える（読みを直す流れの確認用）
const MINI_DICT={'竹藪':'たけやぶ','焼':'や','新聞紙':'しんぶんし','私':'わたし','負':'ま','世':'よ','中':'なか','顔':'かお','金':'きん',
  '長':'なが','夜':'よ','遠':'とお','睡':'ねぶ','皆':'みな','目醒':'めざ','波乗':'なみの','船':'ふね','音':'おと','良':'よ'};
const KANJI=/[㐀-鿿々〆]/;
function autoReading(text){
  const chars=[...text.normalize('NFC')],unknown=[];
  let out='';
  for(let i=0;i<chars.length;){
    if(!KANJI.test(chars[i])){out+=chars[i];i++;continue;}
    let hit=null;
    for(let L=Math.min(4,chars.length-i);L>=1&&!hit;L--){const w=chars.slice(i,i+L).join('');if(MINI_DICT[w])hit=w;}
    if(hit){out+=MINI_DICT[hit];i+=[...hit].length;}else{unknown.push(chars[i]);i++;}
  }
  return {yomi:toKana(out).join(''),unknown};
}
// 直した読みは、漢字の部分だけが変わり、かなの部分がそのままのときだけ使う（表示と無関係な読みを入れるズルの防止）
function readingOk(text,yomi){
  const runs=text.normalize('NFC').match(/[㐀-鿿々〆]+|[ぁ-ゖァ-ヶー]+/g)||[];
  const re=runs.map(r=>KANJI.test(r[0])?'(.+?)':toKana(r).join('')).join('');
  return new RegExp('^'+re+'$').test(toKana(yomi).join(''));
}
const PRESETS=['竹藪焼けた','新聞紙','私負けましたわ','ダンスがすんだ','世の中ね顔かお金かなのよ（読み違いの例）','長き夜の遠の睡りの皆目醒め波乗り船の音の良きかな','あああああ','たけやぶ（不成立の例）'];
function fillPresets(sel,input,yomi){
  sel.innerHTML='<option value="">プリセットから選ぶ…</option>'+PRESETS.map(p=>`<option>${p}</option>`).join('');
  sel.addEventListener('change',()=>{if(sel.value){input.value=sel.value.replace(/（.*）/,'');sel.value='';yomi.value=autoReading(input.value).yomi;refresh();}});
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function info(text,yomiIn){
  const auto=autoReading(text);
  let yomi=auto.yomi,warn='';
  const fixed=yomiIn==null?'':toKana(yomiIn).join('');
  if(fixed&&fixed!==auto.yomi){
    if(readingOk(text,fixed))yomi=fixed;
    else warn='かなの部分は変えられません（漢字の読みだけ直せます）';
  }
  const j=judge(yomi),s=stats(j);
  let note='';
  if(warn)note=warn+'<br>';
  else if(auto.unknown.length&&yomi===auto.yomi)note=`「${esc([...new Set(auto.unknown)].join('」「'))}」の読みが分かりません。読みを直してください<br>`;
  if(j.kind==='不成立'){
    const L=j.loose,i=j.bad,k=L.length-1-i;
    note+='崩れている所：'+L.map((c,x)=>x===i||x===k?`<mark>${esc(c)}</mark>`:esc(c)).join('');
  }else if(j.kind==='短すぎ')note+='読みで3文字以上にしてください';
  else if(j.kind==='ゆるめ')note+='濁点・小さい字・長音の違いを許した成立（持久力が下がる）';
  else if(j.kind==='手抜き')note+='同じ音ばかりの回文は弱いコマになる';
  else note+=`${j.n}音・音の種類${j.uniq}`;
  const bar=(name,v,max)=>`<div class="st"><span>${name}</span><span class="b"><i style="width:${clamp(v/max,0,1)*100}%"></i></span><span>${v.toFixed(2)}</span></div>`;
  const html=`<span class="kind${j.kind==='成立'?' ok':''}">${j.kind}</span><p class="note">${note}</p>`+
    (j.kind==='短すぎ'?'':bar('重さ',s.weight,3)+bar('持久力',s.endurance,1)+bar('攻撃',s.attack,1.2));
  return {j,s,html,text,yomi};
}
let me,opp;
function refresh(){
  me=info($('inMe').value,$('yoMe').value);opp=info($('inOpp').value,$('yoOpp').value);
  $('infoMe').innerHTML=me.html;$('infoOpp').innerHTML=opp.html;
  $('fight').disabled=me.j.kind==='短すぎ'||opp.j.kind==='短すぎ';
  $('solo').disabled=me.j.kind==='短すぎ';
}
// 上面に書くのは入力したままの文字（漢字を含む）。刃の枚数は攻撃が強いほど多い（性能が形に出る）
const metaOf=(x,side)=>{const t=[...x.text.replace(/\s/g,'')];return {chars:t.length?t:['？'],radius:x.s.radius,color:C[side],dark:C[side+'-dark'],glow:C[side+'-glow'],blades:clamp(Math.round(2+x.s.attack*3.5),3,6)};};

// ---- 演出 ----
const BIG=['ガキィン!!','ドゴォッ!!','バチィッ!!','ズガァン!!','ギャリリッ!!','ドカァッ!!'];
let mode='idle',run=null,aim=null,simT=0,hitStop=0,lastIdx=-1,lastFight=null;
let sparks=[],rings=[],words=[],confetti=[],glows=[],flash=0,shake=0,aberr=0;
const cam={z:1,x:0,y:0,tz:1,tx:0,ty:0,hold:0};
function resetFx(){
  sparks=[];rings=[];words=[];confetti=[];glows=[];flash=0;shake=0;aberr=0;hitStop=0;
  Object.assign(cam,{z:1,x:W/2,y:H/2,tz:1,tx:W/2,ty:H/2,hold:0});
}
function burst(x,y,pw,colors){
  const n=Math.round(12+50*pw);
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,v=S*(0.5+3.2*pw)*(0.3+0.7*Math.random());
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*0.7-S*0.4,life:0.3+0.5*Math.random(),c:colors[i%colors.length],w:1.5+3*pw*Math.random()});
  }
}
function word(text,x,y,size,life,rot){words.push({text,x,y,size,life,rot,t:0});}
function focus(x,y,z,hold){cam.tz=z;cam.tx=x;cam.ty=y;cam.hold=hold;}
function onHit(h,first){
  const p=proj(h.x,h.y),y=p.y-S*0.1,pw=first?1:h.p;
  glows.push({x:p.x,y,r:S*(0.35+0.6*pw),life:0.4,t:0,c:'#ffffff'},{x:p.x,y,r:S*(0.6+0.8*pw),life:0.55,t:0,c:C.neon});
  burst(p.x,y,pw,[C.spark,'#ffffff',C.neon,run.metas[0].glow,run.metas[1].glow]);
  rings.push({x:p.x,y,r:4,vr:S*(1.5+3*pw),life:0.45,t:0,w:4+8*pw});
  if(first||pw>0.35){
    word(first?'ガッキィィン!!!':BIG[h.i%BIG.length],p.x,y-S*0.18,S*(first?0.24:0.12+0.12*pw),first?1.3:0.9,((h.f*37)%100/100-0.5)*0.5);
    flash=Math.max(flash,first?0.4:0.08+0.15*pw);aberr=Math.max(aberr,first?1:0.3+0.5*pw);
    hitStop=Math.max(hitStop,first?0.22:0.04+0.1*pw);
    shake=Math.max(shake,first?34:8+22*pw);
    focus(p.x,y,first?1.25:1.05+0.08*pw,first?0.9:0.3);
  }else shake=Math.max(shake,5);
}
function onRim(rm){
  const p=proj(rm.x,rm.y);
  burst(p.x,p.y-S*0.08,rm.p*0.6,[C.spark,'#ffffff',C.neon]);
  if(rm.p>0.55)word('ガンッ!',p.x,p.y-S*0.25,S*0.11,0.6,(rm.f%10/10-0.5)*0.6);
  shake=Math.max(shake,4+10*rm.p);
}
function onOut(f){
  const p=proj(f[0],f[1]);
  word('場外!!',p.x,p.y-S*0.3,S*0.26,1.6,-0.15);
  burst(p.x,p.y-S*0.1,1,[C.spark,'#ffffff',C.neon2]);
  flash=Math.max(flash,0.3);aberr=1;shake=Math.max(shake,30);
  glows.push({x:p.x,y:p.y-S*0.1,r:S,life:0.6,t:0,c:C.neon2});
}
// 漫画の集中線
function speedLines(cx,cy,inner,alpha,color){
  const R=Math.hypot(W,H);
  g.save();g.globalAlpha=alpha;g.fillStyle=color;
  for(let i=0;i<70;i++){
    const a=Math.random()*6.283,wd=0.006+Math.random()*0.018,r0=inner*(0.85+Math.random()*0.5);
    g.beginPath();g.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
    g.lineTo(cx+Math.cos(a-wd)*R,cy+Math.sin(a-wd)*R);g.lineTo(cx+Math.cos(a+wd)*R,cy+Math.sin(a+wd)*R);g.closePath();g.fill();
  }
  g.restore();
}
// 大きな文字。斜体にし、fill に [上の色, 下の色] を渡すとグラデーションで塗る
function bigText(text,x,y,size,fill,rot,scale){
  g.save();g.translate(x,y);g.rotate(rot||0);g.scale(scale||1,scale||1);g.transform(1,0,-0.18,1,0,0);
  g.font=`900 ${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  g.lineWidth=size*0.24;g.strokeStyle='#05070d';g.strokeText(text,0,0);
  g.lineWidth=size*0.09;g.strokeStyle='#ffffff';g.strokeText(text,0,0);
  if(Array.isArray(fill)){const gr=g.createLinearGradient(0,-size*0.5,0,size*0.5);gr.addColorStop(0,fill[0]);gr.addColorStop(1,fill[1]);g.fillStyle=gr;}else g.fillStyle=fill;
  g.fillText(text,0,0);
  g.restore();
}

// 対戦カード：赤と青に斜めに分かれた画面に、双方の回文を大きく出し、中央に VS
function drawVS(t){
  const a=t<1.15?1:Math.max(0,1-(t-1.15)/0.25),e=Math.min(1,t/0.22),ease=1-Math.pow(1-e,3),sl=W*0.1,off=(1-ease)*W*0.7;
  g.save();g.globalAlpha=a;
  g.fillStyle='rgba(3,5,10,.55)';g.fillRect(0,0,W,H);
  [0,1].forEach(k=>{
    const m=run.metas[k],card=run.cards[k],dir=k?1:-1,cx=k?W*0.75:W*0.25;
    g.save();g.translate(dir*off,0);
    g.beginPath();
    if(k===0){g.moveTo(0,0);g.lineTo(W/2+sl,0);g.lineTo(W/2-sl,H);g.lineTo(0,H);}
    else{g.moveTo(W/2+sl,0);g.lineTo(W,0);g.lineTo(W,H);g.lineTo(W/2-sl,H);}
    g.closePath();
    const gr=g.createLinearGradient(k?W:0,0,W/2,H);gr.addColorStop(0,m.color);gr.addColorStop(1,m.dark);
    g.fillStyle=gr;g.globalAlpha=a*0.94;g.fill();
    g.save();g.clip();g.globalAlpha=a*0.12;g.strokeStyle='#ffffff';g.lineWidth=W*0.02;
    for(let i=-6;i<20;i++){const x0=i*W*0.08+((t*W*0.3)%(W*0.08))*dir;g.beginPath();g.moveTo(x0,0);g.lineTo(x0-H*0.4,H);g.stroke();}
    g.restore();g.globalAlpha=a;
    g.font=`italic 900 ${S*0.07}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(255,255,255,.85)';
    g.fillText(card.label,cx,H*0.22);
    const chars=[...card.text],lines=chars.length>7?splitLines(chars,Math.ceil(chars.length/7)):[card.text];
    g.font=`900 100px ${FONT}`;
    const mw=Math.max(...lines.map(l=>g.measureText(l).width)),fs=Math.min(S*0.24,100*W*0.36/mw,H*0.4/lines.length/1.1);
    lines.forEach((ln,i)=>bigText(ln,cx,H*0.48+(i-(lines.length-1)/2)*fs*1.1,fs,['#ffffff',m.glow],0,1));
    g.font=`italic 900 ${S*0.05}px ${FONT}`;g.fillStyle='#ffffff';
    g.fillText(`${card.kind}　重さ${card.s.weight.toFixed(1)}　攻撃${card.s.attack.toFixed(1)}`,cx,H*0.8);
    g.restore();
  });
  g.save();g.globalCompositeOperation='lighter';g.strokeStyle='#ffffff';g.lineWidth=4;g.globalAlpha=a*ease;
  g.beginPath();g.moveTo(W/2+sl,0);g.lineTo(W/2-sl,H);g.stroke();g.restore();
  if(t>0.22)bigText('VS',W/2,H*0.5,S*0.42,[C.gold1,C.gold2],0,Math.max(1,3-11*(t-0.22)));
  g.restore();
}
// 会場の光：上から差すスポットライトと、舞う光の粒
const dust=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),v:0.02+Math.random()*0.05,s:0.6+Math.random()*1.6,p:Math.random()*6.283}));
function stageLights(now,dt){
  g.save();g.globalCompositeOperation='lighter';
  for(const [x0,dir] of [[W*0.1,1],[W*0.9,-1]]){
    const tx=W/2+Math.sin(now/1400+dir)*W*0.12,ty=H*0.7;
    const gr=g.createLinearGradient(x0,0,tx,ty);gr.addColorStop(0,'rgba(170,215,255,.22)');gr.addColorStop(1,'rgba(170,215,255,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(x0-8,-4);g.lineTo(x0+8,-4);g.lineTo(tx+W*0.17,ty);g.lineTo(tx-W*0.17,ty);g.closePath();g.fill();
  }
  for(const d of dust){
    d.y-=d.v*dt;if(d.y<-0.02){d.y=1.02;d.x=Math.random();}
    g.globalAlpha=0.35+0.35*Math.sin(now/300+d.p);g.fillStyle=d.p>3?C.neon:'#ffffff';
    g.beginPath();g.arc(d.x*W+Math.sin(now/900+d.p)*6,d.y*H,d.s,0,Math.PI*2);g.fill();
  }
  g.restore();
}
// 画面の隅のロゴ（録画やスクショに残る）
function logo(){
  g.save();g.transform(1,0,-0.18,1,0,0);
  const fs=Math.max(12,W*0.03),x=W-12+H*0.18,y=H-12;
  g.font=`900 ${fs}px ${FONT}`;g.textAlign='right';g.textBaseline='bottom';
  g.shadowColor=C.neon;g.shadowBlur=10;g.fillStyle='#ffffff';g.fillText('回文ケンカゴマ',x,y);
  g.shadowBlur=0;g.fillStyle=C.neon;g.fillRect(x-fs*7.2,y+2,fs*7.2,2);
  g.restore();
}

// ---- 再生 ----
const INTRO=2.5,INTRO_VS=1.1,INTRO_GO=0.55; // 対戦の前置きの長さ（残り秒数で区切る：VS → レディー → ファイト）
function startRun(specs,metas,seed,labels,cards){
  const res=simulate(specs,seed);
  const hitAt=new Map(),rimAt=new Map();
  res.hits.forEach((h,i)=>{h.i=i;if(!hitAt.has(h.f))hitAt.set(h.f,[]);hitAt.get(h.f).push(h);});
  res.rims.forEach(r=>{if(!rimAt.has(r.f))rimAt.set(r.f,[]);rimAt.get(r.f).push(r);});
  run={res,metas,labels,cards,seed,hitAt,rimAt,solo:specs.length===1,intro:specs.length===1?INTRO_VS:INTRO,bannerT:0,announced:false,
    trails:metas.map(()=>[]),fh:res.hits.length?res.hits[0].f:-1};
  mode='run';simT=0;lastIdx=-1;resetFx();
  $('dbg').textContent=`乱数の種 ${seed}　/　投げの強さ ${specs.map(s=>Math.round(s.power*100)+'%').join(' 対 ')}　/　当たり ${res.hits.length}回・縁 ${res.rims.length}回`;
}
const throwWord=p=>p>=CRIT_POWER?'会心!!':p>=0.7?'いい投げ！':p>=0.4?'まあまあの投げ':'弱い投げ…';
// ひとり回しも勝負も、ゲージで投げてから始める（solo: ひとり回しかどうか）
function beginAim(solo){
  readColors();
  mode='aim';aim={t0:performance.now(),solo};
  $('gauge').hidden=false;$('throw').focus({preventScroll:true});
  $('status').textContent=solo?'ゲージが真ん中に来たところで投げて回す！':'ゲージが真ん中に来たところで投げる！';
}
function gaugeValue(){const u=((performance.now()-aim.t0)/1000*GAUGE_SPEED)%2;return u<1?u:2-u;}
function throwNow(){
  if(mode!=='aim')return;
  const p=Math.round(gaugePower(gaugeValue())*100)/100;
  $('gauge').hidden=true;
  if(aim.solo)soloWith(p);else fightWith(p);
}
function soloWith(pMe){
  lastFight={solo:true,pMe,a:$('inMe').value,ya:$('yoMe').value};
  soloRun(lastFight);
  $('status').textContent=`${throwWord(pMe)}（投げの強さ ${Math.round(pMe*100)}%）`;
  $('again').disabled=false;
}
function soloRun(L){
  readColors();
  const a=info(L.a,L.ya);
  startRun([{stats:a.s,power:L.pMe}],[metaOf(a,'p1')],hashStr('solo|'+a.yomi+'|'+Math.round(L.pMe*100)),null);
}
function fightWith(pMe){
  lastFight={pMe,pOpp:Math.round(oppPower(opp.yomi)*100)/100,a:$('inMe').value,b:$('inOpp').value,ya:$('yoMe').value,yb:$('yoOpp').value};
  fight(lastFight);
  $('status').textContent=`${throwWord(pMe)}（投げの強さ ${Math.round(pMe*100)}%・相手 ${Math.round(lastFight.pOpp*100)}%）`;
  $('again').disabled=false;
}
function fight(L){
  readColors();
  const a=info(L.a,L.ya),b=info(L.b,L.yb);
  const seed=hashStr(a.yomi+'|'+b.yomi+'|'+Math.round(L.pMe*100));
  startRun([{stats:a.s,power:L.pMe},{stats:b.s,power:L.pOpp}],[metaOf(a,'p1'),metaOf(b,'p2')],seed,['あなた','あいて'],[{label:'あなた',text:a.text,kind:a.j.kind,s:a.s},{label:'あいて',text:b.text,kind:b.j.kind,s:b.s}]);
}
// 最初の激突と決着の瞬間はスローにする
function playRate(idx){
  const r=run.res;
  if(!run.solo&&r.kimarite!=='時間切れ'&&idx>=r.decideFrame-40&&idx<=r.decideFrame+8)return 0.3;
  if(run.fh>=0&&idx>=run.fh-6&&idx<=run.fh+24)return 0.3;
  return 1;
}
// 回転メーター：斜めのネオンバー（相手側は右から減る）
function hud(fr){
  g.save();g.textBaseline='top';
  run.metas.forEach((m,k)=>{
    const w=clamp(fr[k][2],0,1),bw=Math.min(150,W*0.3),x=k===0?12:W-12-bw,y=10;
    g.font=`italic 900 13px ${FONT}`;g.textAlign=k===0?'left':'right';g.fillStyle=C['stage-ink'];
    g.fillText((run.labels?run.labels[k]:'回転')+'  SPIN',k===0?x:x+bw,y);
    const bar=(x0,wd)=>{g.beginPath();g.moveTo(x0+6,y+18);g.lineTo(x0+wd+6,y+18);g.lineTo(x0+wd,y+28);g.lineTo(x0,y+28);g.closePath();g.fill();};
    g.fillStyle='rgba(255,255,255,.12)';bar(x,bw);
    g.save();g.shadowColor=m.glow;g.shadowBlur=12;g.fillStyle=m.color;
    if(k===0)bar(x,bw*w);else bar(x+bw*(1-w),bw*w);
    g.restore();
  });
  if(!run.solo){
    const left=Math.max(0,TMAX-Math.min(lastIdx,run.res.decideFrame)*DT);
    g.font=`italic 900 20px ${FONT}`;g.textAlign='center';g.fillStyle=C['stage-ink'];g.fillText(String(Math.ceil(left)),W/2,8);
  }
  g.restore();
}
function resultBanner(dt){
  const res=run.res,t=run.bannerT;
  const s=t<0.22?3-9.1*t:1;
  if(run.solo){
    bigText('ばたん!',W/2,H*0.2,S*0.26,[C.gold1,C.gold2],-0.08,s);
    bigText('回った時間 '+(res.decideFrame*DT).toFixed(1)+'秒',W/2,H*0.2+S*0.26,S*0.1,'#ffffff',0,1);
    return;
  }
  const win=res.winner===0,draw=res.winner===-1;
  speedLines(W/2,H*0.28,Math.min(W,H)*0.3,0.22,'#ffffff');
  bigText(draw?'引き分け':win?'勝ち!!':'負け…',W/2,H*0.26,S*0.34,win||draw?[C.gold1,C.gold2]:[C['p2-glow'],C.p2],-0.1,s);
  if(t>0.25)bigText('決まり手：'+res.kimarite,W/2,H*0.26+S*0.3,S*0.11,'#ffffff',0,1);
  if(win&&!run.confetti){
    run.confetti=true;
    const cols=[C.p1,C.gold2,C.p2,'#ffffff',C.neon];
    for(let i=0;i<110;i++)confetti.push({x:Math.random()*W,y:-Math.random()*H*0.5,vy:60+Math.random()*120,vx:(Math.random()-0.5)*60,a:Math.random()*6,va:(Math.random()-0.5)*10,c:cols[i%cols.length],s:4+Math.random()*5});
  }
}

let prev=performance.now();
function loop(now){
  // 最初のフレームでブラウザが渡す時刻は、スクリプト開始時の時刻より前のことがある（F5直後など）。マイナスにしない
  const dt=clamp((now-prev)/1000,0,0.05);prev=now;
  g.setTransform(DPR,0,0,DPR,0,0);
  const bg=g.createRadialGradient(W/2,H*0.2,0,W/2,H*0.5,Math.max(W,H)*0.8);bg.addColorStop(0,C['stage-bg1']);bg.addColorStop(1,C['stage-bg2']);
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // カメラ（寄り・揺れ）。待機中とゲージ中は中央・寄りなしに戻す
  if(mode!=='run')Object.assign(cam,{tx:W/2,ty:H/2,tz:1,hold:0});
  if(cam.hold>0){cam.hold-=dt;if(cam.hold<=0)focus(W/2,H/2,1,0);}
  const ck=1-Math.exp(-7*dt);
  cam.z+=(cam.tz-cam.z)*ck;cam.x+=(cam.tx-cam.x)*ck;cam.y+=(cam.ty-cam.y)*ck;
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;shake*=Math.exp(-7*dt);
  g.translate(W/2+sx,H/2+sy);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
  g.drawImage(arenaTex(),0,0,W,H);
  let fr=null;
  if(mode==='idle'){
    // 開いた直後：自分のコマが浮いて待っている（回さない。文字が読める向きで止めておく）
    drawTop(metaOf(me,'p1'),[0,0,0,0,0.05,1.57,0,0],0.3+Math.sin(now/600)*0.02);
  }else if(mode==='aim'){
    const bob=0.35+Math.sin(now/300)*0.02,metas=[metaOf(me,'p1'),metaOf(opp,'p2')];
    const starts=aim.solo?[[-0.5,0.2]]:[[-0.7,-0.08],[0.7,0.08]];
    starts.forEach(([x,y],k)=>drawTop(metas[k],[x+(Math.random()-0.5)*0.006,y,0.6,now/900+k,0.12,k?0:3.14,0,0],bob));
    $('needle').style.left=(gaugeValue()*100)+'%';
  }else if(mode==='run'){
    const res=run.res;
    if(run.intro>0){
      const before=run.intro;run.intro-=dt;
      if(before>INTRO-0.22&&run.intro<=INTRO-0.22){flash=0.35;shake=18;}
      if(before>INTRO_GO&&run.intro<=INTRO_GO){flash=0.4;shake=14;}
    }else if(hitStop>0)hitStop-=dt;
    else simT+=dt*playRate(lastIdx)*($('slow').checked?1/3:1);
    const idx=clamp(Math.floor(simT/DT),0,res.frames.length-1);
    for(let f=lastIdx+1;f<=idx;f++){
      for(const h of run.hitAt.get(f)||[])onHit(h,h.i===0);
      for(const rm of run.rimAt.get(f)||[])onRim(rm);
      if(f>0)res.frames[f].forEach((o,k)=>{if(o[6]===1&&res.frames[f-1][k][6]!==1)onOut(o);});
    }
    lastIdx=idx;
    fr=res.frames[idx];
    const t=idx*DT,lift=run.intro>0?0.4:t<0.15?0.4*Math.pow(1-t/0.15,2):0;
    // 残像の軌跡
    fr.forEach((o,k)=>{
      const tr=run.trails[k],p=proj(o[0],o[1]);
      if(run.intro<=0&&o[6]===0){tr.push(p);if(tr.length>12)tr.shift();}
      if(tr.length>2){
        g.save();g.globalCompositeOperation='lighter';g.strokeStyle=run.metas[k].glow;g.lineCap='round';g.lineJoin='round';
        for(let i=1;i<tr.length;i++){g.globalAlpha=0.25*i/tr.length;g.lineWidth=run.metas[k].radius*S*1.1*i/tr.length;
          g.beginPath();g.moveTo(tr[i-1].x,tr[i-1].y-run.metas[k].radius*S*0.5);g.lineTo(tr[i].x,tr[i].y-run.metas[k].radius*S*0.5);g.stroke();}
        g.restore();
      }
    });
    const order=fr.map((f,k)=>k).sort((a,b)=>fr[a][1]-fr[b][1]);
    for(const k of order){
      const f=run.intro>0?[...fr[k]]:fr[k];
      if(run.intro>0){f[0]+=(Math.random()-0.5)*0.01;f[2]=0.6;}
      drawTop(run.metas[k],f,lift);
    }
    // ひとり回しはカメラがコマを追って寄る
    if(run.solo){const p=proj(fr[0][0],fr[0][1]);if(cam.hold<=0.05)focus(p.x,p.y-run.metas[0].radius*S*0.6,1.6,0.05);}
    if(!run.solo&&idx>=res.decideFrame&&res.winner>=0){
      const wf=fr[res.winner],p=proj(wf[0],wf[1]);
      if(cam.hold<=0)focus(p.x,p.y-S*0.1,1.18,0.05);
    }
  }
  // 世界側の演出（火花・衝撃波・擬音）
  g.save();g.globalCompositeOperation='lighter';
  for(const s of sparks){s.life-=dt;s.vy+=S*2.6*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.life>0){g.strokeStyle=s.c;g.lineWidth=s.w;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x-s.vx*0.035,s.y-s.vy*0.035);g.stroke();}}
  g.restore();
  sparks=sparks.filter(s=>s.life>0);
  for(const r of rings){r.t+=dt;r.r+=r.vr*dt;r.vr*=Math.exp(-4*dt);
    const a=1-r.t/r.life;if(a>0){g.globalAlpha=a;g.strokeStyle=C.neon;g.lineWidth=r.w*a;ell(r.x,r.y,r.r,r.r*TILT);g.stroke();}}
  rings=rings.filter(r=>r.t<r.life);g.globalAlpha=1;
  g.save();g.globalCompositeOperation='lighter';
  for(const o of glows){o.t+=dt;const a=1-o.t/o.life;if(a<=0)continue;const r=o.r*(0.6+0.4*o.t/o.life);
    g.save();g.translate(o.x,o.y);g.scale(1,0.8);const gr=g.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,o.c);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=a*0.8;g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();g.restore();}
  g.restore();glows=glows.filter(o=>o.t<o.life);
  for(const w of words){w.t+=dt;
    const pop=w.t<0.1?2.2-12*w.t:1,a=w.t>w.life-0.3?Math.max(0,(w.life-w.t)/0.3):1;
    g.globalAlpha=a;bigText(w.text,w.x,w.y-w.t*S*0.12,w.size,[C.gold1,C.gold2],w.rot,pop);}
  words=words.filter(w=>w.t<w.life);g.globalAlpha=1;
  // 画面側の演出
  if(aberr>0.05){
    // 激突の瞬間、画面を左右にずらして重ね、ぶれて見せる
    const o=Math.round(9*aberr*DPR);
    g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='lighter';g.globalAlpha=0.22*aberr;g.drawImage(cv,o,0);g.drawImage(cv,-o,0);g.restore();
  }
  aberr*=Math.exp(-6*dt);
  g.setTransform(DPR,0,0,DPR,0,0);
  stageLights(now,dt);
  if(mode==='run'){
    if(run.intro>INTRO_VS)drawVS(INTRO-run.intro);
    else if(run.intro>0){
      if(run.intro>INTRO_GO)bigText('レディー…',W/2,H*0.25,S*0.15,'#ffffff',0,1);
      else{speedLines(W/2,H*0.45,Math.min(W,H)*0.32,0.28,'#ffffff');bigText(run.solo?'ゴー!!':'ファイト!!',W/2,H*0.25,S*0.3,[C.gold1,C.gold2],-0.08,Math.max(1,1+(run.intro-0.4)*6));}
    }
    if(run.intro<=INTRO_VS)hud(fr);
    if(lastIdx>=run.res.decideFrame){
      run.bannerT+=dt;resultBanner(dt);
      if(run.solo&&!run.announced){run.announced=true;$('status').textContent=`ばたん！　回った時間：${(run.res.decideFrame*DT).toFixed(1)}秒`;}
      if(!run.solo&&!run.announced){
        run.announced=true;const r=run.res;
        $('status').textContent=`${r.winner===-1?'引き分け':r.winner===0?'勝ち！':'負け…'}　決まり手：${r.kimarite}（${(r.decideFrame*DT).toFixed(1)}秒）`;
      }
    }
  }else if(mode==='idle'){
    g.textAlign='center';g.textBaseline='middle';g.fillStyle=C['stage-ink'];g.font=`italic 900 ${Math.max(14,S*0.07)}px ${FONT}`;
    const msg='「ひとりで回す」か「勝負！」で投げよう',mw=g.measureText(msg).width,fh=Math.max(14,S*0.07);
    g.fillStyle='rgba(5,8,16,.75)';g.beginPath();g.roundRect(W/2-mw/2-16,H*0.12-fh*0.9,mw+32,fh*1.8,fh*0.9);g.fill();
    g.fillStyle=C['stage-ink'];g.shadowColor=C.neon;g.shadowBlur=10;g.fillText(msg,W/2,H*0.12);g.shadowBlur=0;
  }
  for(const c of confetti){c.y+=c.vy*dt;c.x+=c.vx*dt;c.a+=c.va*dt;
    g.save();g.translate(c.x,c.y);g.rotate(c.a);g.fillStyle=c.c;g.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);g.restore();}
  confetti=confetti.filter(c=>c.y<H+20);
  logo();
  if(flash>0.01){g.fillStyle=`rgba(255,255,255,${flash})`;g.fillRect(0,0,W,H);flash*=Math.exp(-9*dt);}
  requestAnimationFrame(loop);
}

fillPresets($('preMe'),$('inMe'),$('yoMe'));fillPresets($('preOpp'),$('inOpp'),$('yoOpp'));
// 回文を書き換えたら読みを推定し直す。読みの欄を書き換えたら、その読みで判定する
for(const [i,y] of [['inMe','yoMe'],['inOpp','yoOpp']]){
  $(i).addEventListener('input',()=>{$(y).value=autoReading($(i).value).yomi;refresh();});
  $(y).addEventListener('input',refresh);
}
$('solo').addEventListener('click',()=>beginAim(true));
$('fight').addEventListener('click',()=>beginAim(false));
$('throw').addEventListener('click',throwNow);
cv.addEventListener('pointerdown',throwNow);
$('again').addEventListener('click',()=>{if(lastFight){if(lastFight.solo)soloRun(lastFight);else fight(lastFight);$('status').textContent='同じ条件でもう一回（結果も同じになるはず）';}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&mode==='aim'){e.preventDefault();throwNow();}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
window.addEventListener('resize',resize);
// 試作の確認用：?demo=1.15 で、その投げの強さですぐ勝負する。?solo=1.15 でひとり回し。&t=5 で5秒目から再生（掛け声は飛ばす）。&me=…&opp=… で回文を指定
const qs=new URLSearchParams(location.search),demo=qs.get('demo');
if(qs.get('me'))$('inMe').value=qs.get('me');
if(qs.get('opp'))$('inOpp').value=qs.get('opp');
$('yoMe').value=autoReading($('inMe').value).yomi;$('yoOpp').value=autoReading($('inOpp').value).yomi;
resize();readColors();refresh();resetFx();
if(demo!==null)fightWith(clamp(+demo||0,0,CRIT_POWER));
else if(qs.get('solo')!==null)soloWith(clamp(+qs.get('solo')||0,0,CRIT_POWER));
if(run&&qs.get('t')){simT=+qs.get('t')||0;lastIdx=Math.floor(simT/DT)-1;run.intro=0;}
requestAnimationFrame(loop);
</script>
</body>
</html>
